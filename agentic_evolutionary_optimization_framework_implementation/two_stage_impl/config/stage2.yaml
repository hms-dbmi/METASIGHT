# Stage 2 settings. The budget per task is in stage2_budget.csv; the rule is in metasight2s/stage2/budget.py.

provider: anthropic       # anthropic (default) | openai | mock (offline, no API). Real providers also need
                          # --allow-api and METASIGHT2S_ALLOW_API=1; `stage2 --provider mock` runs offline.
carry_top_k: 3            # Stage 1 candidates carried into Stage 2 (each raw and calibrated: 2k slots)
batch_size: 8             # proposals per model call
search_bootstrap: 100     # bootstrap resamples while scoring candidates 
final_bootstrap: 1000     # resamples for the final re-score of the selected program

mock:
  seed: 0
  invalid_rate: 0.05

openai:                   # alternative provider: GPT-6 Luna
  model: gpt-6-luna
  max_completion_tokens: 16000
  timeout: 300
  max_retries: 8
  reasoning_effort: null

anthropic:                # default provider: Claude Opus 5.5
  model: claude-opus-5-5  # `stage2 --model <name>` overrides it, e.g. claude-haiku-5-5 for a low-cost pipeline check
  max_tokens: 16000
  effort: high
  timeout: 600
  max_retries: 8
  fallbacks: true         # server-side refusal fallback; always off for Claude Haiku models, which have none
