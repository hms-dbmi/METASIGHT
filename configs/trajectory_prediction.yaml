# METASIGHT: Future Trajectory Prediction Module
# Multi-class classification at fixed time horizons with IPCW

# Model configuration
foundation_model: "CHIEF"  # CHIEF | GIGAPATH | KEEP | MUSK
slide_type: "MIX"           # FS | PM | MIX

# Training hyperparameters
batch_size: 32
learning_rate: 0.00001
dropout: 0.2
num_epochs: 50
fold_n: 5
patience: 7
seed: 42
grad_clip_max_norm: 1.0

# Loss function (every loss is computed per sample and weighted by IPCW)
loss_type: "ordinal"  # ordinal (alias: distance) | ce | focal | combined; ordinal = CE + expected ordinal distance penalty

# KL regularization: VAE bottleneck before the classification head (--no_kl to disable)
use_kl: true
latent_dim: 32
kl_weight: 0.001  # weight of KL within the VAE loss
vae_weight: 1.0   # weight of the VAE loss (reconstruction + KL) in the total loss

# Learning rate scheduler
scheduler_type: "cosine"  # none | cosine | plateau
scheduler_T0: 10

# Time horizons for outcome classification (days)
cutoffs: [365, 730, 1095]  # 1, 2, 3 years

# IPCW settings
use_cross_fit_ipcw: true  # recommended

# Cancer types (specify one or more; supports TCGA or custom cancer types)
cancer_list:
  - ACC
  - BLCA
  - BRCA
  - CESC
  - CHOL
  - COAD
  - ESCA
  - HNSC
  - KICH
  - KIRC
  - KIRP
  - LIHC
  - LUAD
  - LUSC
  - MESO
  - PAAD
  - PRAD
  - READ
  - SKCM
  - STAD
  - TGCT
  - THCA
  - UVM
  # - CUSTOM_CANCER  # Add your own cancer types

# Evaluation
min_samples_per_cancer: 30  # Minimum test samples for per-cancer metrics

# Data paths (update these to your local paths)
feature_root: "/path/to/foundation_model_features/WSI_features/"
clinical_root: "/path/to/clinical_data/"
label_file: "/path/to/labels/future_trajectory_label.csv"

# Output
output_dir: "results/trajectory_prediction"

