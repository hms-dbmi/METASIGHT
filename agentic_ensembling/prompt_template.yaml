prompt: |
  You are an expert in ensemble learning for computational pathology.

  # TASK
  # -------------------------------------------------------------------------
  # <TASK_DESCRIPTION>
  # Examples:
  #   - "cancer metastasis prediction (M0/M1 binary classification)"
  #   - "3-class survival prediction (censored/early event/late event)"
  # -------------------------------------------------------------------------
  Design an ensemble aggregation function for combining predictions from
  4 pre-trained foundation models (CHIEF, UNI, GIGAPATH, VIRCHOW2) for
  <TASK_DESCRIPTION>.

  # TASK CONTEXT
  # -------------------------------------------------------------------------
  # This task involves aggregating predictions from 4 state-of-the-art
  # pathology foundation models. Each model was independently trained and
  # produces probability predictions for the target task.
  #
  # The goal is to design a smart ensemble strategy that:
  # 1. Leverages the strengths of each model
  # 2. Accounts for model-specific biases and specializations
  # 3. Handles different cancer types appropriately
  # 4. Produces well-calibrated probability outputs
  # -------------------------------------------------------------------------

  - **Models**: CHIEF, UNI, GIGAPATH, VIRCHOW2 (4 foundation models)
  - **Input**: Predictions from 4 models per patient
  - **Output**: <OUTPUT_DESCRIPTION>
    # Examples:
    #   - "Single probability per patient, shape (n_patients,)"
    #   - "Dict with class0/class1/class2 probability arrays"
  - **Dataset**: <DATASET_DESCRIPTION>
    # Examples:
    #   - "TCGA pan-cancer internal cohort, ~5,700 patients, 23 cancer types"
    #   - "External validation (DFCI), ~1,200 patients, 9 cancer types"
    #   - "External validation (HANCOCK), ~800 patients, 7 cancer types"
  - **Evaluation**: <EVALUATION_METRICS>
    # Examples:
    #   - "Overall AUROC (primary), per-cancer std (secondary)"
    #   - "Macro AUROC, C-index, per-cancer consistency"

  # INPUT DATA STRUCTURE
  # -------------------------------------------------------------------------
  # The input is a nested dictionary containing predictions from each model.
  # Each model provides a 'consolidated' key with final predictions.
  # -------------------------------------------------------------------------
  ```python
  model_preds: Dict[str, Dict]
  # Structure:
  # {
  #     'CHIEF': {
  #         'consolidated': <PREDICTION_STRUCTURE>
  #     },
  #     'UNI': {
  #         'consolidated': <PREDICTION_STRUCTURE>
  #     },
  #     'GIGAPATH': {
  #         'consolidated': <PREDICTION_STRUCTURE>
  #     },
  #     'VIRCHOW2': {
  #         'consolidated': <PREDICTION_STRUCTURE>
  #     }
  # }
  # Binary: np.ndarray shape (n_patients,)
  # Multi-class: {'class0': array, 'class1': array, 'class2': array}

  cancer_types: np.ndarray
  # Shape: (n_patients,)
  # Contains strings like "BRCA", "LUAD", "COAD", etc.

  <ADDITIONAL_INPUTS>
  # Optional additional inputs, e.g.:
  #   - "ipcw_weights: np.ndarray  # inverse probability censoring weights"
  ```

  # OUTPUT
  # -------------------------------------------------------------------------
  ```python
  <OUTPUT_TYPE>
  # Binary: np.ndarray shape (n_patients,) with probabilities in [0, 1]
  # Multi-class: Dict[str, np.ndarray] with keys 'class0', 'class1', 'class2'
  ```

  # DESIGN STRATEGIES TO CONSIDER
  # -------------------------------------------------------------------------
  1. **Weighting strategies**: Fixed weights, confidence-based, variance-based
  2. **Aggregation methods**: Mean, median, geometric mean, rank-based
  3. **Cancer-specific logic**: Different weights per cancer type
  4. **Model selection**: Choose best model(s) per sample or cancer type
  5. **Calibration**: Adjust predictions based on model characteristics
  6. **Confidence weighting**: Weight by prediction certainty

  # CONSTRAINTS
  # -------------------------------------------------------------------------
  # These constraints MUST be followed - do not modify the interface.
  # -------------------------------------------------------------------------
  - Function signature: <FUNCTION_SIGNATURE>
    # Examples:
    #   - "ensemble_predictions(model_preds, cancer_types) -> np.ndarray"
    #   - "ensemble_predictions(model_preds, cancer_types, ipcw_weights) -> Dict"
  - Must handle all 4 models: CHIEF, UNI, GIGAPATH, VIRCHOW2
  - Output must have same length as number of patients
  - Output values must be valid probabilities, no NaN/Inf

  # PERFORMANCE REFERENCE
  # -------------------------------------------------------------------------
  <PERFORMANCE_METRICS>
  # Fill in your baseline performance data:
  # Individual model performance:
  #   - CHIEF:    <VALUE>
  #   - UNI:      <VALUE>
  #   - GIGAPATH: <VALUE>
  #   - VIRCHOW2: <VALUE>
  # Simple average baseline: <VALUE>
  # Target: <TARGET_VALUE>

  # MODEL SPECIALIZATIONS
  # -------------------------------------------------------------------------
  <MODEL_SPECIALIZATIONS>
  # Fill in which models excel on which cancer types:
  # - CHIEF excels at:    <CANCER_TYPES>
  # - UNI excels at:      <CANCER_TYPES>
  # - GIGAPATH excels at: <CANCER_TYPES>
  # - VIRCHOW2 excels at: <CANCER_TYPES>

  # TIPS
  # -------------------------------------------------------------------------
  - Use 'consolidated' key for clean predictions (no NaN values)
  - Cancer types have different sample sizes
  - Use cancer_types argument for subgroup-specific strategies
  - Consider model agreement/disagreement as a confidence signal

  # AVAILABLE LIBRARIES
  - numpy as np
  - typing.Dict
  - DO NOT import torch, tensorflow, or other deep learning frameworks

  # GOAL
  # -------------------------------------------------------------------------
  # Based on the information above, please modify the program provided below
  # to create an optimized ensemble function. Follow all constraints and
  # leverage the model specializations to maximize performance.
  # -------------------------------------------------------------------------

  Below is the initial program. Please modify it according to the rules and
  constraints above to create an optimized ensemble function:

  ```python
  import numpy as np
  from typing import Dict

  def ensemble_predictions(
      model_preds: Dict[str, Dict],
      cancer_types: np.ndarray
  ) -> np.ndarray:
      """
      Ensemble aggregation function for combining predictions from
      4 foundation models (CHIEF, UNI, GIGAPATH, VIRCHOW2).

      Args:
          model_preds: Dict of predictions per model
              {model_name: {'consolidated': np.ndarray}}
          cancer_types: Array of cancer type labels per patient

      Returns:
          np.ndarray: Aggregated predictions, shape (n_patients,)
      """
      model_names = ['CHIEF', 'UNI', 'GIGAPATH', 'VIRCHOW2']

      # Extract predictions from each model
      all_preds = []
      for model_name in model_names:
          if model_name in model_preds:
              if 'consolidated' in model_preds[model_name]:
                  all_preds.append(model_preds[model_name]['consolidated'])

      # Simple averaging
      ensemble_pred = np.mean(all_preds, axis=0)

      return ensemble_pred
  ```

